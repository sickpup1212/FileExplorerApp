<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected folder &middot; File Explorer</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center;
               justify-content: center; background: #f1f3f5; padding: 1rem; }
        .card { width: 100%; max-width: 360px; padding: 2rem; border: 0;
                border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.12);
                text-align: center; }
        .lock { font-size: 2rem; margin-bottom: .5rem; }
        h1 { font-size: 1.1rem; margin: 0 0 .25rem; word-break: break-word; }
        p.sub { color: #6c757d; font-size: .875rem; margin: 0 0 1.25rem; }
        .error { color: #dc3545; font-size: .85rem; min-height: 1.2rem; margin-top: .75rem; }
    </style>
</head>
<body>
    <div class="card bg-white">
        {% if valid %}
        <div class="lock">&#128274;</div>
        <h1>{{ name }}</h1>
        <p class="sub">
            {% if owner %}Shared by {{ owner }}. {% endif %}Enter the PIN to view this folder.
        </p>
        <form id="unlockForm">
            <input type="password" class="form-control text-center" id="pin"
                   inputmode="numeric" placeholder="PIN" autocomplete="off"
                   style="letter-spacing:.3em;" required>
            <div class="error" id="error" role="alert"></div>
            <button type="submit" class="btn btn-primary w-100 mt-3">Unlock</button>
        </form>
        {% else %}
        <div class="lock">&#9888;</div>
        <h1>Link not valid</h1>
        <p class="sub">This protected folder no longer exists, or the link was revoked.</p>
        <a class="btn btn-outline-secondary w-100" href="/">Go to the explorer</a>
        {% endif %}
    </div>

    {% if valid %}
    <script>
        const TOKEN = {{ token | tojson }};

        document.getElementById('unlockForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const errorEl = document.getElementById('error');
            errorEl.textContent = '';

            let response;
            try {
                response = await fetch('/api/pin/unlock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ token: TOKEN, pin: document.getElementById('pin').value }),
                });
            } catch (e) {
                errorEl.textContent = 'Could not reach the server';
                return;
            }

            let data = {};
            try { data = await response.json(); } catch (e) { /* empty body */ }

            if (!response.ok) {
                errorEl.textContent = data.error || 'Could not unlock';
                document.getElementById('pin').value = '';
                document.getElementById('pin').focus();
                return;
            }

            // Land inside the unlocked folder. The server scopes every request
            // from here on, so navigating up is not possible.
            window.location.href = '/explorer/' + encodeURIComponent(data.path);
        });
    </script>
    {% endif %}
</body>
</html>
