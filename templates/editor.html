<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Editor - Modern File Explorer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5/lib/codemirror.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5/theme/monokai.css">
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5/lib/codemirror.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5/mode/javascript/javascript.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5/mode/xml/xml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5/mode/css/css.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5/mode/python/python.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="explorer">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h5>Navigation</h5>
                <button class="sidebar-toggle" id="sidebarClose">
                    <i data-feather="x"></i>
                </button>
            </div>
            <div class="nav-links">
                <a href="/" class="nav-link">
                    <i data-feather="folder"></i>
                    File Explorer
                </a>
                <a href="/editor" class="nav-link active">
                    <i data-feather="edit-2"></i>
                    Text Editor
                </a>
                <a href="/password-manager" class="nav-link">
                    <i data-feather="key"></i>
                    Password Manager
                </a>
                <a href="/document-chat" class="nav-link">
                    <i data-feather="message-square"></i>
                    Document Chat
                </a>
                <a href="/logout" class="nav-link">
                    <i data-feather="log-out"></i>
                    Logout
                </a>
            </div>
        </div>
        <div class="main-content">
            <div class="toolbar">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i data-feather="menu"></i>
                </button>
                <div class="btn-group">
                    <button class="btn btn-light" id="newFileBtn">
                        <i data-feather="file-plus"></i> New File
                    </button>
                    <button class="btn btn-light" id="openFileBtn">
                        <i data-feather="folder-open"></i> Open File
                    </button>
                    <button class="btn btn="light" id="saveFileBtn">
                        <i data-feather="save"></i> Save
                    </button>
                </div>
            </div>
            <div class="editor-container">
                <textarea id="editor"></textarea>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/editor.js') }}"></script>
</body>
</html>
